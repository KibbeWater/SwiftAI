name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux is a first-class target, not an afterthought: the streaming transport is built on
  # URLSession delegates precisely so that one implementation serves both platforms. Running the
  # full suite here is what keeps that true.
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1", "6.2"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --parallel

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --parallel

  # Guards against a change that builds on the host platform but not for a device, which is where
  # availability mistakes usually surface.
  apple-platforms:
    name: ${{ matrix.destination.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        destination:
          - name: iOS
            value: "generic/platform=iOS Simulator"
          - name: watchOS
            value: "generic/platform=watchOS Simulator"
          - name: tvOS
            value: "generic/platform=tvOS Simulator"
    steps:
      - uses: actions/checkout@v4

      - name: Select toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build
        run: |
          xcodebuild build \
            -scheme SwiftAI-Package \
            -destination '${{ matrix.destination.value }}' \
            -skipMacroValidation \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

  # Live tests are opt-in and never run on pull requests, because they cost money and depend on
  # third-party availability. They exist to catch a provider changing its wire format, which no
  # fixture can detect.
  live:
    name: Live provider checks
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch'
    environment: live-tests
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test --parallel
        env:
          SWIFTAI_LIVE_TESTS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
